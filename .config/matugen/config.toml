[config]
reload_apps = false

[config.wallpaper]
command = "true"
set = false

[templates.colors]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/batcave/generated/colors.css'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/batcave/generated/kitty-colors.conf'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.config/batcave/generated/rofi-colors.rasi'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprlock-colors.conf'
output_path = '~/.config/batcave/generated/hyprlock-colors.conf'